# Dev overrides — live-mount backend source so code changes take effect on restart
# Usage: ./dev.sh up -d
# To apply a change: ./dev.sh restart engine   (or celery_worker, celery_beat, watchdog)

services:

  engine:
    environment:
      - LOG_LEVEL=debug
    volumes:
      - ./backend/anchor:/app/anchor
    # Hot-reload on file change
    command: uvicorn anchor.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    environment:
      - LOG_LEVEL=debug
    volumes:
      - ./backend/anchor:/app/anchor

  celery_beat:
    volumes:
      - ./backend/anchor:/app/anchor

  watchdog:
    volumes:
      - ./backend/anchor:/app/anchor

  # Expose DB and Redis directly in dev for local tooling (TablePlus, redis-cli, etc.)
  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
