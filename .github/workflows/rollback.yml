name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit SHA to redeploy
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository at requested ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry==2.3.2

      - name: Install backend dependencies
        working-directory: backend
        run: |
          poetry lock
          poetry install --with dev

      - name: Lint (ruff)
        working-directory: backend
        run: poetry run ruff check anchor tests

      - name: Verify app imports
        working-directory: backend
        run: poetry run python -c "from anchor.main import create_app; create_app()"

      - name: Run backend smoke tests
        working-directory: backend
        run: poetry run pytest tests/integration/test_ci_smoke.py tests/unit/test_risk_gates.py -q

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  rollback:
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository at requested ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve full SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate deploy secrets
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          DEPLOY_VPS_USER: ${{ secrets.DEPLOY_VPS_USER }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || { echo "DEPLOY_SSH_PRIVATE_KEY is missing"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS is missing"; exit 1; }
          test -n "$DEPLOY_VPS_HOST" || { echo "DEPLOY_VPS_HOST is missing"; exit 1; }
          test -n "$DEPLOY_VPS_USER" || { echo "DEPLOY_VPS_USER is missing"; exit 1; }

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Add VPS host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy selected ref to VPS
        env:
          VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          VPS_USER: ${{ secrets.DEPLOY_VPS_USER }}
          DEPLOY_SHA: ${{ steps.resolve.outputs.sha }}
        run: bash infrastructure/scripts/deploy.sh

      - name: Health check (with SHA verification)
        env:
          VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          VPS_USER: ${{ secrets.DEPLOY_VPS_USER }}
          DEPLOY_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'EOF'
            cd /opt/anchor
            for i in $(seq 1 24); do
              response=$(curl -fsS http://127.0.0.1:8080/api/v1/system/health || true)
              if [ -n "$response" ]; then
                echo "health attempt $i: $response"
              else
                echo "health attempt $i: no response"
              fi
              if [ -n "$response" ] && echo "$response" | python3 -c 'import json, os, sys; print("ok" if json.loads(sys.stdin.read()).get("deployed_sha") == os.environ["DEPLOY_SHA"] else "mismatch")' | grep -qx ok; then
                echo "Rollback verified — SHA matches"
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed or deployed SHA did not match"
            docker compose ps || true
            docker compose logs --tail=100 engine nginx || true
            exit 1
          EOF
