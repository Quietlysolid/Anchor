name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit SHA to redeploy
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository at requested ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Add VPS host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy selected ref to VPS
        env:
          VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          VPS_USER: ${{ secrets.DEPLOY_VPS_USER }}
          DEPLOY_SHA: ${{ inputs.ref }}
        run: bash infrastructure/scripts/deploy.sh

      - name: Health check
        env:
          VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          VPS_USER: ${{ secrets.DEPLOY_VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            for i in 1 2 3 4 5 6; do
              if curl -fsS http://127.0.0.1:8080/api/v1/system/health; then
                exit 0
              fi
              sleep 5
            done
            exit 1
          '
