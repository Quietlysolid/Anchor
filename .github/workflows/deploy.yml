name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry==2.3.2

      - name: Install backend dependencies
        working-directory: backend
        run: |
          poetry lock
          poetry install --with dev

      - name: Verify app imports
        working-directory: backend
        run: poetry run python -c "from anchor.main import create_app; create_app()"

      - name: Run backend smoke tests
        working-directory: backend
        run: poetry run pytest tests/integration/test_api_smoke.py -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          DEPLOY_VPS_USER: ${{ secrets.DEPLOY_VPS_USER }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || { echo "DEPLOY_SSH_PRIVATE_KEY is missing"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS is missing"; exit 1; }
          test -n "$DEPLOY_VPS_HOST" || { echo "DEPLOY_VPS_HOST is missing"; exit 1; }
          test -n "$DEPLOY_VPS_USER" || { echo "DEPLOY_VPS_USER is missing"; exit 1; }

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Add VPS host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          VPS_USER: ${{ secrets.DEPLOY_VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: bash infrastructure/scripts/deploy.sh

      - name: Health check
        env:
          VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          VPS_USER: ${{ secrets.DEPLOY_VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            for i in 1 2 3 4 5 6; do
              response=$(curl -fsS http://127.0.0.1:8080/api/v1/system/health || true)
              if [ -n "$response" ] && echo "$response" | grep -F "\"deployed_sha\":\"$DEPLOY_SHA\"" >/dev/null; then
                echo "$response"
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed or deployed SHA did not match"
            exit 1
          '
