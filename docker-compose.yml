services:

  db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: anchor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-anchor}
      POSTGRES_USER: ${DB_USER:-anchor}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-anchor} -d ${DB_NAME:-anchor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: anchor_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ib_gateway:
    image: gnzsnz/ib-gateway:stable
    container_name: anchor_ib_gateway
    restart: unless-stopped
    env_file: .env
    environment:
      - TWS_USERID=${TWS_USERID}
      - TWS_PASSWORD=${TWS_PASSWORD}
      - TWS_ACCEPT_INCOMING=${TWS_ACCEPT_INCOMING:-accept}
      - TRADING_MODE=${TRADING_MODE:-paper}
      - READ_ONLY_API=${READ_ONLY_API:-no}
      - VNC_SERVER_PASSWORD=${VNC_SERVER_PASSWORD:-}
      - AUTO_RESTART_TIME=${AUTO_RESTART_TIME:-}
      - RELOGIN_AFTER_2FA_TIMEOUT=${RELOGIN_AFTER_2FA_TIMEOUT:-no}
      - TIME_ZONE=${TIME_ZONE:-Etc/UTC}
    ports:
      - "127.0.0.1:4001:4001"
      - "127.0.0.1:4002:4002"
      - "127.0.0.1:5900:5900"

  engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anchor_engine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ib_gateway:
        condition: service_started
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_NAME=engine
    volumes:
      - mlflow_artifacts:/app/mlflow_artifacts
      - ./data:/app/data
      - ./data/models:/app/models
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anchor_celery
    restart: unless-stopped
    depends_on:
      - redis
      - db
      - ib_gateway
    env_file: .env
    environment:
      - SERVICE_NAME=celery
    command: celery -A anchor.scheduler.celery_app worker --loglevel=info -Q ml_tasks,default
    volumes:
      - mlflow_artifacts:/app/mlflow_artifacts
      - ./data:/app/data
      - ./data/models:/app/models

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anchor_beat
    restart: unless-stopped
    depends_on:
      - redis
      - db
      - ib_gateway
    env_file: .env
    environment:
      - SERVICE_NAME=celery_beat
    command: celery -A anchor.scheduler.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    volumes:
      - mlflow_artifacts:/app/mlflow_artifacts
      - ./data/models:/app/models

  mlflow:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anchor_mlflow
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    command: >
      mlflow server
        --backend-store-uri postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${MLFLOW_DB_NAME:-anchor_mlflow}
        --default-artifact-root /app/mlflow_artifacts
        --host 0.0.0.0
        --port 5000
    volumes:
      - mlflow_artifacts:/app/mlflow_artifacts
    ports:
      - "127.0.0.1:5000:5000"

  watchdog:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anchor_watchdog
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ib_gateway:
        condition: service_started
    env_file: .env
    environment:
      - SERVICE_NAME=watchdog
    command: python -m anchor.monitoring.watchdog
    volumes:
      - ./data/models:/app/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anchor_frontend
    restart: unless-stopped
    depends_on:
      - engine
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:5173:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: anchor_nginx
    restart: unless-stopped
    depends_on:
      - engine
      - frontend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
      # Uncomment after certbot:
      # - /etc/letsencrypt:/etc/letsencrypt:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: anchor_prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'

  grafana:
    image: grafana/grafana:11.2.0
    container_name: anchor_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  pg_data:
  redis_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:
  nginx_logs:
