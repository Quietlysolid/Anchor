events {
    worker_connections 1024;
}

http {
    # Use Docker's internal DNS resolver — re-resolves hostnames on each request
    # so nginx never caches stale IPs after container restarts/rebuilds
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # HTTP — accessible immediately without SSL cert
    # After cert is issued, swap to the HTTPS server block below
    server {
        listen 80;
        server_name _;

        client_max_body_size 10M;

        # React dashboard
        location / {
            set $upstream_frontend http://frontend:3000;
            proxy_pass         $upstream_frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        # REST API
        location /api/ {
            set $upstream_engine http://engine:8000;
            proxy_pass         $upstream_engine;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        # WebSocket
        location /ws {
            set $upstream_engine http://engine:8000;
            proxy_pass         $upstream_engine;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 86400s;
        }

        # Prometheus metrics — internal only
        location /metrics {
            set $upstream_engine http://engine:8000;
            proxy_pass $upstream_engine;
            allow 127.0.0.1;
            deny all;
        }
    }

    # ── HTTPS server block (uncomment after running certbot) ──
