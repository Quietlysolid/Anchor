[tool.poetry]
name = "anchor"
version = "0.1.0"
description = "Autonomous Forex Trading System"
authors = []
packages = [{ include = "anchor" }]

[tool.poetry.dependencies]
python = "^3.12"

# Web framework
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }

# Database
sqlalchemy = { version = "^2.0.0", extras = ["asyncio"] }
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.0"
alembic = "^1.14.0"

# OANDA broker
oandapyV20 = "^0.7.2"

# Data processing
pandas = "^2.2.0"
numpy = "^1.26.0"
ta = "^0.11.0"
scipy = "^1.14.0"

# Machine learning
xgboost = "^2.1.0"
lightgbm = "^4.5.0"
scikit-learn = "^1.5.0"
hmmlearn = "^0.3.3"
mlflow = "^2.16.0"

# Task queue
celery = { version = "^5.4.0", extras = ["redis"] }
redis = "^5.0.0"

# Scheduling
APScheduler = "^3.11.0"

# HTTP / scraping
httpx = "^0.27.0"
beautifulsoup4 = "^4.13.0"
lxml = "^5.0.0"

# Validation / settings
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"

# Logging / monitoring
structlog = "^24.4.0"
prometheus-client = "^0.21.0"

# Utilities
python-dotenv = "^1.0.0"
tenacity = "^9.0.0"      # Retry logic
pytz = "^2024.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.27.0"         # For FastAPI TestClient
ruff = "^0.7.0"
mypy = "^1.13.0"
types-pytz = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
